name: Dependency Submission

on:
  push:
    branches: [main]
    paths:
      - "**/*.csproj"
      - "**/*.sln"
      - "**/*.props"
      - "**/*.targets"
      - "**/packages.lock.json"
      - "NuGet.Config"
      - "nuget.config"
      - "global.json"
      - ".github/workflows/dependency-submission.yml"
  pull_request:
    paths:
      - "**/*.csproj"
      - "**/*.sln"
      - "**/*.props"
      - "**/*.targets"
      - "**/packages.lock.json"
      - "NuGet.Config"
      - "nuget.config"
      - "global.json"
      - ".github/workflows/dependency-submission.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit-nuget:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NuGetPackageSourceCredentials_cntryl: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Submit NuGet dependency graph
        uses: advanced-security/component-detection-dependency-submission-action@b282c67b1008fde9b60da4bdfcd8849613e293b2 # v0.1.6
        with:
          detectorsCategories: NuGet
          token: ${{ secrets.GITHUB_TOKEN }}
