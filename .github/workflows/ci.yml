name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  fast:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Fitz.sln

      - name: Check formatting
        run: dotnet format Fitz.sln --verify-no-changes --no-restore --severity warn

      - name: Build
        run: dotnet build Fitz.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Core/Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName!~Integration

  package:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Fitz.sln

      - name: Pack NuGet packages
        run: dotnet pack Fitz.sln -c Release --no-restore --output artifacts/packages

      - name: Smoke restore packed packages
        run: dotnet restore tests/PackageConsumer/PackageConsumer.csproj --source artifacts/packages --source https://api.nuget.org/v3/index.json && dotnet build tests/PackageConsumer/PackageConsumer.csproj -c Release --no-restore

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: fitz-dotnet-packages
          path: artifacts/packages

  spec:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        transport: [ws, tcp]
        auth_mode: [anonymous, valid_jwt]
    env:
      FITZ_BROKER_ANON_TCP_ADDR: localhost:4191
      FITZ_BROKER_ANON_WS_ADDR: ws://localhost:4190/ws
      FITZ_BROKER_AUTH_TCP_ADDR: localhost:4091
      FITZ_BROKER_AUTH_WS_ADDR: ws://localhost:4090/ws
      FITZ_BROKER_JWT_HMAC_SECRET: dev-test-secret
      FITZ_BROKER_JWT_AUDIENCE: fitz
      CONFORMANCE_OUTPUT: artifacts/conformance-${{ matrix.transport }}-${{ matrix.auth_mode }}.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Start broker stack
        run: docker compose up -d

      - name: Restore
        run: dotnet restore Fitz.sln

      - name: Build
        run: dotnet build Fitz.sln -c Release --no-restore

      - name: Run conformance tests
        env:
          CONFORMANCE_TRANSPORT: ${{ matrix.transport }}
          CONFORMANCE_AUTH_MODE: ${{ matrix.auth_mode }}
        run: dotnet test tests/Core/Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName~Conformance

      - name: Run domain workflow tests
        if: matrix.transport == 'ws' && matrix.auth_mode == 'anonymous'
        run: dotnet test tests/Core/Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName~DomainWorkflowIntegrationTests

      - name: Run invalid JWT auth scenario
        env:
          CONFORMANCE_TRANSPORT: ${{ matrix.transport }}
          CONFORMANCE_AUTH_MODE: anonymous
        run: dotnet test tests/Core/Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName~should_fail_invalid_jwt_auth_when_connecting

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitz-dotnet-conformance-${{ matrix.transport }}-${{ matrix.auth_mode }}
          path: artifacts/conformance-${{ matrix.transport }}-${{ matrix.auth_mode }}.json
          if-no-files-found: warn

      - name: Stop broker stack
        if: always()
        run: docker compose down --volumes
