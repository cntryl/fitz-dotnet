name: CI

on:
  # Only main, because an open pull request already covers its own branch. An unfiltered
  # push trigger ran every job twice for any branch with a PR: once for push, once for
  # pull_request.
  push:
    branches: [main]
  pull_request:

# One run per branch. A new push supersedes the run still going for the branch it replaced,
# except on main, where every commit keeps its own result rather than being cancelled by
# whatever merges next.
permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NuGetPackageSourceCredentials_cntryl: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

jobs:
  fast:
    name: Build and test (${{ matrix.os }})
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      # The transports use TCP and WebSocket, whose behavior differs per OS; let every OS
      # report rather than hiding a second failure behind the first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Fitz.slnx

      # Formatting is OS-independent; checking it once avoids line-ending noise on Windows.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format Fitz.slnx --verify-no-changes --no-restore --severity warn

      - name: Build
        run: dotnet build Fitz.slnx -c Release --no-restore

      # --blame-hang-timeout turns a hung test into a failure with a dump instead of a job
      # that runs until timeout-minutes.
      - name: Run unit tests
        run: >
          dotnet test test/Fitz.Core.Tests/Fitz.Core.Tests.csproj -c Release --no-build
          --filter "Category!=Integration" --blame-hang-timeout 2m
          --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results

      - name: Run analyzer tests
        run: >
          dotnet test test/Fitz.Analyzers.Tests/Fitz.Analyzers.Tests.csproj -c Release --no-build
          --blame-hang-timeout 2m
          --logger "trx;LogFileName=analyzers.trx" --results-directory artifacts/test-results

      - name: Run testing-package tests
        run: >
          dotnet test test/Fitz.Testing.Tests/Fitz.Testing.Tests.csproj -c Release --no-build
          --blame-hang-timeout 2m
          --logger "trx;LogFileName=testing.trx" --results-directory artifacts/test-results

      - name: Run extensions tests
        run: >
          dotnet test test/Fitz.Extensions.Tests/Fitz.Extensions.Tests.csproj -c Release --no-build
          --blame-hang-timeout 2m
          --logger "trx;LogFileName=extensions.trx" --results-directory artifacts/test-results

      # Exercises packing (package validation, SourceLink, analyzer packing) on every pull
      # request, not only at release time.
      - name: Pack NuGet packages
        run: dotnet pack Fitz.slnx -c Release --no-build --output artifacts/packages

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/**
          if-no-files-found: warn
