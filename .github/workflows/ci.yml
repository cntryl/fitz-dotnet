name: CI

on:
  # Only main, because an open pull request already covers its own branch. An unfiltered
  # push trigger ran every job twice for any branch with a PR: once for push, once for
  # pull_request.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

# One run per branch. A new push supersedes the run still going for the branch it replaced,
# except on main, where every commit keeps its own result rather than being cancelled by
# whatever merges next.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NuGetPackageSourceCredentials_cntryl: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

jobs:
  fast:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Fitz.sln

      - name: Check formatting
        run: dotnet format Fitz.sln --verify-no-changes --no-restore --severity warn

      - name: Build
        run: dotnet build Fitz.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test test/Fitz.Core.Tests/Fitz.Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName!~Integration

      - name: Run analyzer tests
        run: dotnet test test/Fitz.Analyzers.Tests/Fitz.Analyzers.Tests.csproj -c Release --no-build

  package:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Fitz.sln

      - name: Pack NuGet packages
        run: dotnet pack Fitz.sln -c Release --no-restore --output artifacts/packages

      - name: Smoke restore packed packages
        run: dotnet restore test/Fitz.PackageConsumer/Fitz.PackageConsumer.csproj && dotnet run --project test/Fitz.PackageConsumer/Fitz.PackageConsumer.csproj -c Release --no-restore

      - name: Set up minimum supported .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.100"

      - name: Smoke analyzer on minimum supported compiler
        working-directory: test/Fitz.PackageConsumer
        run: |
          dotnet --version
          dotnet restore Fitz.PackageConsumer.csproj
          dotnet build Fitz.PackageConsumer.csproj -c Release --no-restore

      # PackageVersion is fixed across rebuilds and NuGet keys its extracted cache on id
      # and version alone, so a copy left from an earlier pack would shadow the packages
      # just built. The consumer restores into its own folder (RestorePackagesPath) to make
      # clearing it safe and cheap.
      - name: Clear consumer package cache
        run: rm -rf artifacts/consumer-package-cache

      # Roots every shipped assembly, so ILC analyzes all of them rather than only what the
      # consumer's Main reaches. Configured in Fitz.PackageConsumer.csproj.
      - name: Publish Native AOT consumer from packed packages
        run: dotnet publish test/Fitz.PackageConsumer/Fitz.PackageConsumer.csproj -c Release -r linux-x64 -p:PublishAot=true --output artifacts/native-aot

      - name: Run Native AOT consumer
        run: artifacts/native-aot/Fitz.PackageConsumer

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: fitz-dotnet-packages
          path: artifacts/packages

  spec:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        transport: [ws, tcp]
        auth_mode: [anonymous, valid_jwt]
    env:
      FITZ_BROKER_ANON_TCP_ADDR: localhost:4191
      FITZ_BROKER_ANON_WS_ADDR: ws://localhost:4190/ws
      FITZ_BROKER_AUTH_TCP_ADDR: localhost:4091
      FITZ_BROKER_AUTH_WS_ADDR: ws://localhost:4090/ws
      FITZ_BROKER_JWT_HMAC_SECRET: dev-test-secret
      FITZ_BROKER_JWT_AUDIENCE: fitz
      CONFORMANCE_OUTPUT: artifacts/conformance-${{ matrix.transport }}-${{ matrix.auth_mode }}.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Start broker stack
        run: docker compose up -d

      - name: Restore
        run: dotnet restore Fitz.sln

      - name: Build
        run: dotnet build Fitz.sln -c Release --no-restore

      - name: Run conformance tests
        env:
          CONFORMANCE_TRANSPORT: ${{ matrix.transport }}
          CONFORMANCE_AUTH_MODE: ${{ matrix.auth_mode }}
        run: dotnet test test/Fitz.Core.Tests/Fitz.Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName~Conformance

      - name: Run domain workflow tests
        if: matrix.transport == 'ws' && matrix.auth_mode == 'anonymous'
        run: dotnet test test/Fitz.Core.Tests/Fitz.Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName~DomainWorkflowIntegrationTests

      - name: Run invalid JWT auth scenario
        env:
          CONFORMANCE_TRANSPORT: ${{ matrix.transport }}
          CONFORMANCE_AUTH_MODE: anonymous
        run: dotnet test test/Fitz.Core.Tests/Fitz.Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName~ShouldRejectAuthenticationGivenInvalidJwtWhenConnectCalled

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fitz-dotnet-conformance-${{ matrix.transport }}-${{ matrix.auth_mode }}
          path: artifacts/conformance-${{ matrix.transport }}-${{ matrix.auth_mode }}.json
          if-no-files-found: warn

      - name: Stop broker stack
        if: always()
        run: docker compose down --volumes
