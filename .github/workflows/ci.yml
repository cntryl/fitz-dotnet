name: CI

on:
  push:
  pull_request:

jobs:
  fast:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Fitz.sln

      - name: Build
        run: dotnet build Fitz.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Core/Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName!~Integration

  package:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Fitz.sln

      - name: Pack NuGet packages
        run: dotnet pack Fitz.sln -c Release --no-restore --output artifacts/packages

      - name: Smoke restore packed packages
        run: |
          dotnet new console -o artifacts/smoke/sample --framework net10.0
          cat <<'CS' > artifacts/smoke/sample/Program.cs
          using Cntryl.Fitz;
          using Cntryl.Fitz.Abstractions.Domains.Kv;
          using Cntryl.Fitz.DependencyInjection;
          using Microsoft.Extensions.DependencyInjection;

          var services = new ServiceCollection();
          services.AddFitzClient(new ClientConfig("ws://localhost:4190/ws"));

          Console.WriteLine(typeof(Client).FullName);
          Console.WriteLine(typeof(IKvClient).FullName);
          Console.WriteLine(typeof(ServiceCollectionExtensions).FullName);
          CS
          cd artifacts/smoke/sample
          dotnet add package Cntryl.Fitz --version 0.1.0 --source ../../packages
          dotnet add package Cntryl.Fitz.Abstractions --version 0.1.0 --source ../../packages
          dotnet add package Cntryl.Fitz.DependencyInjection --version 0.1.0 --source ../../packages
          dotnet build -c Release

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: fitz-dotnet-packages
          path: artifacts/packages

  spec:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        transport: [ws, tcp]
        auth_mode: [anonymous, valid_jwt]
    env:
      FITZ_BROKER_ANON_TCP_ADDR: localhost:4191
      FITZ_BROKER_ANON_WS_ADDR: ws://localhost:4190/ws
      FITZ_BROKER_AUTH_TCP_ADDR: localhost:4091
      FITZ_BROKER_AUTH_WS_ADDR: ws://localhost:4090/ws
      FITZ_BROKER_JWT_HMAC_SECRET: test-secret-key
      FITZ_BROKER_JWT_AUDIENCE: fitz
      CONFORMANCE_OUTPUT: artifacts/conformance-results.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify transport support is implemented
        run: |
          if [ "${{ matrix.transport }}" = "tcp" ]; then
            grep -q '"tcp"' src/Core/Transport/TransportResolver.cs
          fi

      - name: Start broker stack
        run: docker compose -f compose.yml up -d

      - name: Restore
        run: dotnet restore Fitz.sln

      - name: Build
        run: dotnet build Fitz.sln -c Release --no-restore

      - name: Run conformance tests
        env:
          CONFORMANCE_TRANSPORT: ${{ matrix.transport }}
          CONFORMANCE_AUTH_MODE: ${{ matrix.auth_mode }}
        run: dotnet test tests/Core/Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName~Conformance

      - name: Run invalid JWT auth scenario
        env:
          CONFORMANCE_TRANSPORT: ${{ matrix.transport }}
          CONFORMANCE_AUTH_MODE: anonymous
        run: dotnet test tests/Core/Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName~should_fail_invalid_jwt_auth_when_connecting

      - name: Enforce full conformance
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          suite_path = Path("conformance/cross-language-conformance-suite.yaml")
          required = set(re.findall(r'^\s*-\s+id:\s+"([^"]+)"', suite_path.read_text(encoding="utf-8"), flags=re.MULTILINE))
          path = Path("artifacts/conformance-results.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          observed = {s["scenario_id"] for s in data["scenarios"]}
          missing = sorted(required - observed)
          failing = sorted(s["scenario_id"] for s in data["scenarios"] if s["scenario_id"] in required and s["verdict"] != "pass")
          print(f"transport={data['transport']} auth={data['auth_mode']} scenarios={len(observed)}/{len(required)} p0={data['p0_pass_rate']:.0%} p1={data['p1_pass_rate']:.0%} failing={failing} missing={missing}")
          if data.get("overall_status") != "pass" or failing or missing:
              raise SystemExit(1)
          PY

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitz-dotnet-conformance-${{ matrix.transport }}-${{ matrix.auth_mode }}
          path: artifacts/conformance-results.json

      - name: Stop broker stack
        if: always()
        run: docker compose -f compose.yml down --volumes
