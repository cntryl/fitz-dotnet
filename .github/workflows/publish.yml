name: Publish

on:
  workflow_dispatch:

# Serialize publishes rather than cancelling them: interrupting a run partway through
# dotnet nuget push would leave some packages pushed and the rest not.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  NuGetPackageSourceCredentials_cntryl: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    name: Pack and publish packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Read package version
        id: version
        run: echo "package-version=$(dotnet msbuild src/Fitz.Abstractions/Fitz.Abstractions.csproj -getProperty:PackageVersion -nologo)" >> "$GITHUB_OUTPUT"
      - name: Pack packages
        run: dotnet pack Fitz.sln --configuration Release --output artifacts/packages -p:PackageVersion="${{ steps.version.outputs.package-version }}"
      - name: Publish packages
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "$NUGET_AUTH_TOKEN" --source "$PACKAGE_SOURCE" --skip-duplicate
      - name: Tag release
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          git tag "v${PACKAGE_VERSION}"
          git push origin "refs/tags/v${PACKAGE_VERSION}"
