name: Publish

on:
  workflow_dispatch:

# Serialize publishes rather than cancelling them: interrupting a run partway through
# dotnet nuget push would leave some packages pushed and the rest not.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  NuGetPackageSourceCredentials_cntryl: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet pack Fitz.sln --configuration Release
      - run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source https://nuget.pkg.github.com/cntryl/index.json --skip-duplicate
