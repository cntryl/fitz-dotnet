name: Publish

on:
  workflow_dispatch:

# Serialize publishes rather than cancelling them: interrupting a run partway through
# dotnet nuget push would leave some packages pushed and the rest not.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  NuGetPackageSourceCredentials_cntryl: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

# Release order and failure modes (deliberate):
#   1. Fail fast if tag v<PackageVersion> already exists: that version has been released, so the
#      author forgot to bump PackageVersion. Nothing is built or pushed.
#   2. Build, unit tests, pack and the Native AOT consumer check all run BEFORE anything is
#      pushed, so a broken build never reaches the feed.
#   3. Push every package, then create the tag. The tag is the "release complete" marker.
#      If the push fails part way, no tag exists, and re-running resumes: --skip-duplicate
#      lets packages already pushed be skipped instead of failing the run. Keeping it is safe
#      only because of guard 1, which turns "same version released again" into a hard failure
#      rather than a silent no-op; the push step also fails if it pushed nothing at all.
#   4. If tagging fails after a complete push, the feed is correct and only the tag is
#      missing. Re-running would fail the "pushed nothing" check, so create the tag by hand.
jobs:
  publish:
    name: Verify, pack and publish packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Read package version
        id: version
        run: echo "package-version=$(dotnet msbuild src/Fitz.Abstractions/Fitz.Abstractions.csproj -getProperty:PackageVersion -nologo)" >> "$GITHUB_OUTPUT"

      - name: Fail if this version is already tagged
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${PACKAGE_VERSION}" >/dev/null; then
            echo "::error::Tag v${PACKAGE_VERSION} already exists. Bump PackageVersion in Directory.Build.props before publishing."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Fitz.slnx

      - name: Build
        run: dotnet build Fitz.slnx -c Release --no-restore

      - name: Run unit tests
        run: dotnet test test/Fitz.Core.Tests/Fitz.Core.Tests.csproj -c Release --no-build --filter "Category!=Integration" --blame-hang-timeout 2m

      - name: Run analyzer tests
        run: dotnet test test/Fitz.Analyzers.Tests/Fitz.Analyzers.Tests.csproj -c Release --no-build --blame-hang-timeout 2m

      - name: Run testing-package tests
        run: dotnet test test/Fitz.Testing.Tests/Fitz.Testing.Tests.csproj -c Release --no-build --blame-hang-timeout 2m

      - name: Run extensions tests
        run: dotnet test test/Fitz.Extensions.Tests/Fitz.Extensions.Tests.csproj -c Release --no-build --blame-hang-timeout 2m

      - name: Pack packages
        run: dotnet pack Fitz.slnx -c Release --no-build --output artifacts/packages

      # The same check as the Native AOT workflow, against the exact packages about to be
      # pushed. NuGet caches by package id and version, so clear any earlier copy first.
      - name: Clear consumer package cache
        run: rm -rf artifacts/consumer-package-cache

      - name: Publish Native AOT consumer
        run: dotnet publish test/Fitz.PackageConsumer/Fitz.PackageConsumer.csproj -c Release -r linux-x64 -p:PublishAot=true --output artifacts/native-aot

      - name: Run Native AOT consumer
        run: artifacts/native-aot/Fitz.PackageConsumer

      # --skip-duplicate exists only to resume a partly failed run (see the header comment);
      # the tag guard above rejects a re-release of an already-published version.
      - name: Publish packages
        run: |
          set -o pipefail
          dotnet nuget push "artifacts/packages/*.nupkg" --api-key "$NUGET_AUTH_TOKEN" --source "$PACKAGE_SOURCE" --skip-duplicate | tee push.log
          if ! grep -q "Your package was pushed" push.log; then
            echo "::error::No package was pushed; every one was already in the feed."
            exit 1
          fi

      - name: Tag release
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          git tag "v${PACKAGE_VERSION}"
          git push origin "refs/tags/v${PACKAGE_VERSION}"
