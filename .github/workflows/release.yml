name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Fitz.sln

      - name: Pack NuGet packages
        run: dotnet pack Fitz.sln -c Release --no-restore --output artifacts/packages

      - name: Smoke restore packed packages
        run: dotnet restore tests/PackageConsumer/PackageConsumer.csproj --source artifacts/packages --source https://api.nuget.org/v3/index.json && dotnet build tests/PackageConsumer/PackageConsumer.csproj -c Release --no-restore

      - name: Publish packages to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          find artifacts/packages -maxdepth 1 -name '*.nupkg' ! -name '*.snupkg' -print0 \
            | xargs -0 -n1 dotnet nuget push --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
