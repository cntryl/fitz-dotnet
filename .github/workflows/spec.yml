name: Spec

on:
  workflow_dispatch:
    inputs:
      broker_image:
        description: >-
          Broker image to test instead of the digest pinned in compose.yml, for example
          ghcr.io/cntryl/fitz:latest to check a new broker release deliberately.
        required: false
        default: ""
        type: string
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NuGetPackageSourceCredentials_cntryl: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

jobs:
  spec:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transport: [ws, tcp]
        auth_mode: [anonymous, valid_jwt]
    env:
      FITZ_BROKER_ANON_TCP_ADDR: localhost:4191
      FITZ_BROKER_ANON_WS_ADDR: ws://localhost:4190/ws
      FITZ_BROKER_AUTH_TCP_ADDR: localhost:4091
      FITZ_BROKER_AUTH_WS_ADDR: ws://localhost:4090/ws
      FITZ_BROKER_JWT_HMAC_SECRET: dev-test-secret
      FITZ_BROKER_JWT_AUDIENCE: fitz
      CONFORMANCE_OUTPUT: artifacts/conformance-${{ matrix.transport }}-${{ matrix.auth_mode }}.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The default broker is the image digest pinned in compose.yml, so a broker release
      # cannot turn the nightly run red without a repository change. A manual dispatch may
      # name another image; it is applied through compose.override.yml, which compose merges.
      - name: Select broker image override
        if: inputs.broker_image != ''
        env:
          BROKER_IMAGE: ${{ inputs.broker_image }}
        run: |
          cat > compose.override.yml <<EOF
          services:
            fitz-auth:
              image: ${BROKER_IMAGE}
            fitz-anon:
              image: ${BROKER_IMAGE}
          EOF
          echo "Testing broker image ${BROKER_IMAGE}"

      - name: Start broker stack
        run: docker compose up -d

      - name: Wait for brokers
        run: .github/scripts/wait-for-broker.sh 90

      - name: Restore
        run: dotnet restore Fitz.slnx

      - name: Build
        run: dotnet build Fitz.slnx -c Release --no-restore

      - name: Run conformance tests
        env:
          CONFORMANCE_TRANSPORT: ${{ matrix.transport }}
          CONFORMANCE_AUTH_MODE: ${{ matrix.auth_mode }}
        run: dotnet test test/Fitz.Core.Tests/Fitz.Core.Tests.csproj -c Release --no-build --filter "Category=Conformance" --blame-hang-timeout 5m

      - name: Run domain workflow tests
        if: matrix.transport == 'ws' && matrix.auth_mode == 'anonymous'
        run: dotnet test test/Fitz.Core.Tests/Fitz.Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName~DomainWorkflowIntegrationTests

      - name: Run invalid JWT auth scenario
        env:
          CONFORMANCE_TRANSPORT: ${{ matrix.transport }}
          CONFORMANCE_AUTH_MODE: anonymous
        run: dotnet test test/Fitz.Core.Tests/Fitz.Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName~ShouldRejectAuthenticationGivenInvalidJwtWhenConnectCalled

      - name: Run cancellation chains
        shell: bash
        run: |
          case "${{ matrix.transport }}/${{ matrix.auth_mode }}" in
            tcp/anonymous) endpoint=tcp://localhost:4191 ;;
            ws/anonymous) endpoint=ws://localhost:4190/ws ;;
            tcp/valid_jwt) endpoint=tcp://localhost:4091 ;;
            ws/valid_jwt) endpoint=ws://localhost:4090/ws ;;
          esac
          if [[ "${{ matrix.auth_mode }}" == valid_jwt ]]; then
            FITZ_RPC_CHAIN_ADDR="$endpoint" \
              dotnet test test/Fitz.Core.Tests/Fitz.Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName~RpcCancellationChainTests
          else
            env -u FITZ_BROKER_JWT_HMAC_SECRET FITZ_RPC_CHAIN_ADDR="$endpoint" \
              dotnet test test/Fitz.Core.Tests/Fitz.Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName~RpcCancellationChainTests
          fi

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fitz-dotnet-conformance-${{ matrix.transport }}-${{ matrix.auth_mode }}
          path: artifacts/conformance-${{ matrix.transport }}-${{ matrix.auth_mode }}.json
          if-no-files-found: warn

      - name: Stop broker stack
        if: always()
        run: docker compose down --volumes
